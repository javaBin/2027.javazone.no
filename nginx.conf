server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the ALB, so never redirect to the container's own host/port
    absolute_redirect off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed filenames under /assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Prerendered pages (scripts/prerender-meta.mjs) live at <route>/index.html; everything else falls back to the SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
